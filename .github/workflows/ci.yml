name: CI

# Build the library, tests, examples and cases, and run the tests, on
# GitHub-hosted runners. Hardware-dependent performance tests live in
# performance.yml (manual, self-hosted).
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G
  # Allow more MPI ranks than cores on the runners.
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable release build, warnings as errors, unit + validation tests on 1 and 2 ranks.
          - name: gcc release
            preset: portable
            cc: gcc
            cxx: g++
            werror: "ON"
            labels: "unit|validation"
          # Second compiler: catches non-portable code (e.g. GCC-only extensions).
          - name: clang release
            preset: portable
            cc: clang
            cxx: clang++
            werror: "OFF"
            labels: "unit"
          # AddressSanitizer + UndefinedBehaviorSanitizer on the unit tests.
          - name: gcc sanitizers
            preset: sanitize
            cc: gcc
            cxx: g++
            werror: "OFF"
            labels: "unit"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build ccache g++ clang patch wget \
            libopenmpi-dev openmpi-bin libhdf5-openmpi-dev

      - name: Restore Palabos
        id: palabos
        uses: actions/cache@v4
        with:
          path: palabos
          key: palabos-${{ hashFiles('setup.sh', 'patch/**') }}

      - name: Download and patch Palabos
        if: steps.palabos.outputs.cache-hit != 'true'
        run: ./setup.sh

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ matrix.cc }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-${{ matrix.cc }}-

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DHEMOCELL_WERROR=${{ matrix.werror }}

      - name: Build library, variants, tests, examples and cases
        run: >
          cmake --build build-${{ matrix.preset }} --target
          hemocell hemocell_interior_viscosity hemocell_solidify_mechanics
          hemocell_test hemocell_examples hemocell_cases

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-${{ matrix.preset }} -L "${{ matrix.labels }}" --output-on-failure

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  format:
    # Only the lines a pull request changes must follow .clang-format, so the
    # check works without reformatting the whole code base.
    name: formatting of changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-format
      - name: Check changed lines
        run: |
          base=${{ github.event.pull_request.base.sha }}
          out=$(git clang-format --binary clang-format --diff "$base" -- \
                config core helper io mechanics tests examples cases tools hemocell.h || true)
          if printf '%s\n' "$out" | grep -q '^diff --git'; then
            printf '%s\n' "$out"
            echo "::error::Changed lines do not follow .clang-format. Run 'git clang-format $base' and commit the result."
            exit 1
          fi
          echo "Changed lines follow .clang-format."

  docs:
    name: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends doxygen graphviz
      - name: Build the user guide
        run: |
          python -m pip install -r doc/requirements.txt
          make -C doc/user_guide html
      - uses: actions/upload-artifact@v4
        with:
          name: user-guide-html
          path: doc/user_guide/_build/html
